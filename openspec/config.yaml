# openspec/config.yaml — SaludRed SDD configuration
# Generated by sdd-init on 2026-11-17.

schema: spec-driven

context: |
  Stack: FastAPI 0.115 + SQLAlchemy 2.0/Alembic + Neon Postgres (shared), pymongo 4/MongoDB (billing)
  Frontend: React 18 + TypeScript 5.9 + Vite 7 + PrimeReact + nginx
  Services: ml (FastAPI + sklearn/lightgbm/xgboost), HAPI FHIR, Orthanc PACS, Cloudflare quick tunnels
  Architecture: modular monolith `app/` (api, core, models, schemas, services, events, fhir, billing) + `ml/` + `frontend/`
  Tests: pytest API suite (1192 passed, 5 skipped, 2026-11-17) + ml pytest suite + vitest frontend suite
  Quality: ruff + eslint, tsc (frontend only), prettier; no CI config, no coverage tooling

testing:
  strict_tdd: true
  test_command: python -m pytest tests -q
  test_environment: ASUS machine only (Windows PowerShell, C:\Users\sebas\saludred). Never run tests, builds, or containers on the Mac.
  coverage_command: ""
  capabilities:
    unit: pytest (api+ml), vitest (frontend)
    integration: FastAPI TestClient + mongomock, fake ML/FHIR clients via tests/conftest.py
    e2e: none (no Playwright/Cypress)
    linter: ruff (backend), eslint (frontend)
    type_checker: tsc -b (frontend only; no mypy/pyright in backend)
    formatter: prettier (frontend), ruff format (backend, bundled with ruff 0.8.4)

rules:
  global:
    - Never run tests, builds, or containers on the Mac; execute only on the ASUS machine
    - Neon Postgres is shared: no schema or data operations of any kind
    - Never read, print, or write .env files; reference variable names only when needed
    - No git writes (commits, staging, pushes) during SDD phases
    - Technical artifacts in English; docs/ in neutral professional Spanish
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - tdd: true
    - test_command: python -m pytest tests -q
  verify:
    - test_command: python -m pytest tests -q
    - build_command: ""
    - coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
