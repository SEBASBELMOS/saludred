# Frontend microservice: static UI + reverse proxy to the API.
#
# The browser only ever talks to this origin. Requests for the API are
# forwarded internally to the `api` container, so from the browser's point of
# view the UI and the API share one origin and no CORS configuration is needed.

# Behind the tunnel the visitor arrives over HTTPS but cloudflared talks HTTP to
# this container. Forward the original scheme when present, otherwise our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Hashed build assets are immutable. Backend responses retain their own policy.
map $uri $frontend_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(api/|health|docs|redoc|openapi\.json) "";
}

# The documentation endpoints retain the backend's own resource policy.
map $uri $frontend_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
    ~^/(api/|health|docs|redoc|openapi\.json) "";
}

# Behind Cloudflare every request arrives from the cloudflared container, so the
# client key must come from CF-Connecting-IP; on the LAN fall back to the address.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Rate limits per client. Normal UI usage never reaches 20 req/s sustained, so a
# burst beyond rate + burst receives 429. Login is stricter (10/min, burst 5)
# and is additionally protected by the 3-attempt account lockout.
limit_req_zone $client_key zone=api_per_client:10m rate=20r/s;
limit_req_zone $client_key zone=login_per_client:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15m;

    # Docker's embedded DNS. Resolving the upstream per request, instead of
    # once at startup, keeps the proxy working when the api container is
    # recreated and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $frontend_csp always;
    add_header Cache-Control $frontend_cache_control always;

    # Login has its own, stricter limit. An exact match wins over the regex
    # location below, so it needs the same proxy directives.
    location = /api/v1/auth/login {
        limit_req zone=login_per_client burst=5 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 90s;
    }

    # Live channel (R17, Server-Sent Events). A dedicated exact-match location,
    # so it wins over the generic /api/ regex below. Without these directives
    # nginx (and the Cloudflare tunnel behind it) would hold the events in a
    # buffer and the system would look slow.
    #
    # Rate limit: the stream is ONE long request, not one per event, and a
    # browser reconnects every ~3 s at worst (about 20 per minute), far below
    # the 20 r/s zone. It stays under the same limit as the rest of the API; no
    # exemption is needed. The 1 h read timeout is the longest a connection may
    # stay silent (the API sends a heartbeat every 15 s, so it never is).
    #
    # add_header here replaces the inherited server-level headers, which is why
    # the security ones are repeated. The CSP map is empty for /api/ anyway.
    location = /api/v1/events/stream {
        limit_req zone=api_per_client burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Live channel over WebSocket (R17). This is the channel that works through
    # Cloudflare quick tunnels, which do not deliver an SSE body. An exact-match
    # location wins over the generic /api/ regex, which would not forward the
    # Upgrade handshake. The API sends an application ping every 15 s, well under
    # Cloudflare's ~100 s idle limit, so the 1 h read timeout is never reached
    # by a healthy socket.
    #
    # limit_req applies once per handshake (an upgraded connection is one
    # request), so it cannot cut an open socket; a reconnect storm would get 429
    # and the client backs off. add_header is repeated for the same reason as in
    # the SSE location, and it is harmless on a 101 response.
    location = /api/v1/events/ws {
        limit_req zone=api_per_client burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # API, health probes and the API's own docs go to the backend unchanged.
    location ~ ^/(api/|health|docs|redoc|openapi\.json) {
        limit_req zone=api_per_client burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 90s;
    }

    # Only hashed assets receive a long cache lifetime.
    location /assets/ {
        try_files $uri =404;
    }

    # BrowserRouter deep links resolve to the revalidated application document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
