# Infraestructura completa del proyecto.
#
# `docker compose up -d` levanta las cuatro piezas: la base de datos de la
# aplicacion, la API, el servidor HAPI FHIR y la base de datos propia de HAPI.
# No hace falta instalar Python ni dependencias en la maquina anfitriona.
#
# El PACS (Orthanc) queda en el perfil "pacs" y no arranca por defecto: es
# un servicio pesado y solo se necesita al trabajar con imagenes.
#
#     docker compose --profile pacs up -d orthanc
#
# El servidor FHIR conserva su propia base de datos, separada de la de la
# aplicacion. Son dos sistemas con ciclos de vida distintos: la aplicacion es
# dueña del modelo operativo, HAPI es dueño de la representacion interoperable.
# Compartir una sola base acoplaria nuestras migraciones al esquema interno de
# HAPI, que no controlamos.

services:
  db:
    image: postgres:16-alpine
    container_name: saludred-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saludred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saludred}
      POSTGRES_DB: ${POSTGRES_DB:-saludred}
    ports:
      # Publicado para poder inspeccionar la base con un cliente SQL durante la
      # demostracion. 5433 en el anfitrion para no chocar con un PostgreSQL local.
      - "5433:5432"
    volumes:
      - saludred-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saludred}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: saludred-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Por defecto se usan los servicios internos de Compose, que se resuelven
      # por nombre y no por localhost. Si el .env define DATABASE_URL (por
      # ejemplo, la cadena de una base gestionada en Neon), ese valor gana y el
      # contenedor `db` queda sin uso.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://saludred:saludred@db:5432/saludred}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://hapi:8080/fhir}
      # La API es el unico que habla con el PACS, por nombre de servicio
      # dentro de la red de Docker.
      ORTHANC_URL: ${ORTHANC_URL:-http://orthanc:8042}
      ORTHANC_USER: ${ORTHANC_USER:-api}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc_dev_2026}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  web:
    # Microservicio de interfaz: nginx sirve el front y hace de proxy inverso
    # hacia la API. El navegador solo habla con este origen, asi que el front y
    # la API comparten origen y no hace falta configurar CORS.
    build: ./frontend
    image: saludred-web:latest
    container_name: saludred-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  orthanc:
    # Servidor PACS: aqui viven los pixeles de las imagenes medicas. La base
    # de datos guarda solo los metadatos del estudio, porque PostgreSQL es un
    # mal lugar para binarios de decenas de megabytes y un PACS ya sabe
    # indexar por paciente, estudio, serie e instancia.
    #
    # Tres decisiones de seguridad:
    #
    # 1. Orthanc vive dentro de la red de Docker. El navegador NUNCA le habla:
    #    toda imagen se pide a la API, que primero valida el token y el rol.
    #    Orthanc no conoce nuestros roles ni escribe en nuestro audit_log, asi
    #    que exponerlo romperia el control de acceso y la trazabilidad que
    #    exige la Ley 1581 de 2012.
    # 2. Aun asi se activa su propia autenticacion. Defensa en profundidad: si
    #    alguien alcanzara el puerto, no entra sin credenciales.
    # 3. El puerto 8042 se publica solo en 127.0.0.1, para poder inspeccionarlo
    #    durante el desarrollo. En un despliegue real esa linea se elimina.
    #    El puerto DICOM 4242 no se publica: hoy las imagenes entran por la
    #    API, no por equipos de imagenologia.
    image: orthancteam/orthanc:25.5.1
    container_name: saludred-orthanc
    profiles: ["pacs"]
    environment:
      ORTHANC__NAME: "SaludRed PACS"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      # JSON valido con comillas dobles: la imagen lo parsea tal cual.
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USER:-api}": "${ORTHANC_PASSWORD:-orthanc_dev_2026}"}
    ports:
      - "127.0.0.1:8042:8042"
    volumes:
      - saludred-orthanc-data:/var/lib/orthanc/db
    restart: unless-stopped

  hapi-db:
    image: postgres:16-alpine
    container_name: saludred-hapi-db
    environment:
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
      POSTGRES_DB: hapi
    volumes:
      - saludred-hapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi"]
      interval: 5s
      timeout: 5s
      retries: 12

  hapi:
    image: hapiproject/hapi:v7.4.0
    container_name: saludred-hapi
    depends_on:
      hapi-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Igual que la base de la aplicacion: por defecto se usa el contenedor
      # interno, pero el .env puede apuntar HAPI a una base gestionada. Cuando
      # se hace eso, el contenedor `hapi-db` queda sin uso.
      SPRING_DATASOURCE_URL: ${HAPI_DATABASE_URL:-jdbc:postgresql://hapi-db:5432/hapi}
      SPRING_DATASOURCE_USERNAME: ${HAPI_DATABASE_USER:-hapi}
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DATABASE_PASSWORD:-hapi}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      # Clave con puntos a proposito. El dialecto vive bajo la propiedad-mapa
      # spring.jpa.properties.*, y el "relaxed binding" de Spring no alcanza
      # claves de mapa que contienen puntos cuando la variable viene en
      # MAYUSCULAS_CON_GUION_BAJO. Escrita asi, HAPI genera nextval() de
      # PostgreSQL; escrita en mayusculas, genera sintaxis ANSI que PostgreSQL
      # rechaza con "syntax error at or near seq_resource_id".
      "spring.jpa.properties.hibernate.dialect": ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      # Detras del tunel, Cloudflare entrega el trafico a HAPI por HTTP aunque
      # el visitante llegue por HTTPS. Sin esto HAPI arma sus enlaces con
      # http://, el navegador los bloquea por contenido mixto y su interfaz
      # Swagger no carga. Con FRAMEWORK, Spring respeta la cabecera
      # X-Forwarded-Proto y genera los enlaces con el esquema correcto.
      "server.forward-headers-strategy": FRAMEWORK
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: "true"
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: "-1"
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Publicacion en internet (perfil "public")
  #
  # Estos dos servicios NO arrancan con `docker compose up`. Se levantan solo
  # cuando se necesita exponer el sistema:
  #
  #     docker compose --profile public up -d
  #
  # Cada uno abre un Quick Tunnel de Cloudflare: una conexion SALIENTE hacia
  # Cloudflare que devuelve una URL publica https://algo.trycloudflare.com. No
  # se abre ningun puerto en el router ni queda nada nuevo escuchando en la red
  # local, que es lo que hace seguro este mecanismo.
  #
  # Hay tres tuneles: la interfaz web (que ademas da acceso a la API por su
  # proxy), la API directa y el servidor FHIR, que el enunciado exige publicar.
  #
  # La URL de cada tunel se lee de sus registros:
  #     docker compose logs tunnel-api  | findstr trycloudflare
  #     docker compose logs tunnel-fhir | findstr trycloudflare
  #
  # Importante: la URL CAMBIA cada vez que el contenedor se reinicia. Se genera
  # el dia de la sustentacion y se comparte entonces.
  # ---------------------------------------------------------------------
  tunnel-api:
    # Sin version fija a proposito: cloudflared rechaza clientes viejos contra
    # su infraestructura, asi que anclar una version envejece mal.
    image: cloudflare/cloudflared:latest
    container_name: saludred-tunnel-api
    profiles: ["public"]
    depends_on:
      - api
    command: tunnel --no-autoupdate --url http://api:8000
    restart: unless-stopped

  tunnel-fhir:
    image: cloudflare/cloudflared:latest
    container_name: saludred-tunnel-fhir
    profiles: ["public"]
    depends_on:
      - hapi
    command: tunnel --no-autoupdate --url http://hapi:8080
    restart: unless-stopped

  tunnel-web:
    # Publica la interfaz. Como el front hace de proxy hacia la API, esta sola
    # URL sirve la aplicacion completa.
    image: cloudflare/cloudflared:latest
    container_name: saludred-tunnel-web
    profiles: ["public"]
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://web:80
    restart: unless-stopped

volumes:
  saludred-db-data:
  saludred-hapi-db-data:
  saludred-orthanc-data:
